repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict

  # Prettier - code formatting for JS/TS/JSON/YAML/Markdown
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
          - json
          - yaml
          - markdown
        exclude: |
          (?x)^(
            node_modules/|
            .next/|
            dist/|
            build/|
            coverage/
          )

  # ESLint - linting for JS/TS
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.54.0
    hooks:
      - id: eslint
        types:
          - javascript
          - jsx
          - ts
          - tsx
        args:
          - --fix
          - --max-warnings=0
        exclude: |
          (?x)^(
            node_modules/|
            .next/|
            dist/|
            build/|
            coverage/|
            apps/functions/.env.*
          )
        additional_dependencies:
          - eslint
          - eslint-config-prettier

  # Secret detection (already included above)
  # Using detect-private-key from pre-commit-hooks
